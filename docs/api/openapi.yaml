        Rate Limit: admin.read — 60/دقيقة.
      operationId: adminAnalytics
      x-srs-api: SRS-API-40
      x-rate-limit: "60/دقيقة · user_id · L6"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: بيانات التحليلات / Analytics data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAnalytics" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /admin/analytics/export:
    get:
      tags: [Admin]
      summary: تصدير التحليلات CSV / Export analytics CSV (SRS-API-41)
      description: |
        تصدير الإحصائيات بتنسيق CSV قياسي — للمشرف فقط.
        Rate Limit: admin.export — 10/دقيقة.
      operationId: exportAdminAnalytics
      x-srs-api: SRS-API-41
      x-rate-limit: "10/دقيقة · user_id · L6"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: ملف CSV / CSV file
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="ihyaa-analytics-2026-08-02.csv"
          content:
            text/csv:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimitError"

  # ============================================================
  # AI AGENT — SRS-API-42..43
  # ============================================================
  /ai/analyze/{project}:
    post:
      tags: [AI Agent]
      summary: طلب تحليل متقدم / Request analysis (SRS-API-42)
      description: |
        تحليل تنافسي/SWOT/سوقي/مقارنة عبر وكيل AI — للمالك، بشرط وجود تقييم مكتمل واحد على الأقل.
        معالجة غير متزامنة (نصوص وقوالب فقط — لا MCP خارجي).
        Rate Limit: ai.analyze — 3/دقيقة لكل (user+project).
      operationId: analyzeProject
      x-srs-api: SRS-API-42
      x-rate-limit: "3/دقيقة · user_id+project_id · L5"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [analysis_type]
              properties:
                analysis_type: { $ref: "#/components/schemas/AnalysisType" }
            example: { analysis_type: swot }
      responses:
        "202":
          description: بدأ التحليل / Analysis started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisStartedResponse" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: تحليل قيد المعالجة / Analysis in progress (UC-13 E2)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example: { code: ANALYSIS_IN_PROGRESS, message: لا يزال التحليل قيد المعالجة }
        "422":
          description: تقييم مكتمل مطلوب / Completed evaluation required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example: { code: EVALUATION_REQUIRED, message: يتطلب المشروع تقييماً مكتملاً واحداً على الأقل قبل التحليل }
        "429":
          $ref: "#/components/responses/RateLimitError"

  /ai/analysis/{artifact}:
    get:
      tags: [AI Agent]
      summary: عرض تقرير التحليل / Show analysis report (SRS-API-43)
      description: |
        عرض مخرجات التحليل المحفوظة (SWOT/تنافسي/سوقي/مقارنة) — للمالك.
        Rate Limit: ai.report — 10/دقيقة.
      operationId: showAnalysis
      x-srs-api: SRS-API-43
      x-rate-limit: "10/دقيقة · user_id · L5"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: artifact
          in: path
          required: true
          description: معرّف مخرجات التحليل / Artifact ID
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: التقرير / Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisResponse" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: قيد المعالجة / In progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example: { code: ANALYSIS_IN_PROGRESS, message: لا يزال التحليل قيد المعالجة }
        "429":
          $ref: "#/components/responses/RateLimitError"

# ============================================================
# COMPONENTS
# ============================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token
      description: توكن Sanctum صالح 24 ساعة — يحصل عليه من /login أو /email/verify أو OAuth callback

  parameters:
    Page:
      name: page
      in: query
      description: رقم الصفحة / Page number
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      description: حجم الصفحة / Page size (افتراضي 12، أقصى 50)
      schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
    ProjectPath:
      name: project
      in: path
      required: true
      description: معرّف المشروع / Project ID
      schema: { type: integer, format: int64 }
    EvaluationPath:
      name: evaluation
      in: path
      required: true
      description: معرّف التقييم / Evaluation ID
      schema: { type: integer, format: int64 }
    ProviderPath:
      name: provider
      in: path
      required: true
      description: مزود الهوية / Identity provider
      schema: { type: string, enum: [google, github, linkedin] }

  responses:
    Unauthenticated:
      description: توكن مفقود أو منتهي / Missing or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
          example: { code: UNAUTHENTICATED, message: يجب تسجيل الدخول للوصول إلى هذا المورد }
    Forbidden:
      description: لا صلاحية — دور أو ملكية أو إفصاح / Forbidden — role, ownership or disclosure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
          example: { code: FORBIDDEN, message: ليس لديك صلاحية الوصول إلى هذه الصفحة }
    NotFound:
      description: المورد غير موجود / Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
          example: { code: NOT_FOUND, message: المورد المطلوب غير موجود }
    ProjectUnavailable:
      description: المشروع محذوف أو غير منشور / Project deleted or unpublished
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
          example: { code: PROJECT_NOT_AVAILABLE, message: عذراً، هذا المشروع غير متاح حالياً }
    ValidationError:
      description: فشل التحقق من صحة البيانات / Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
          example:
            code: VALIDATION_ERROR
            message: البيانات المدخلة غير صحيحة
            errors:
              description: [ يجب أن يتراوح طول الوصف بين 50 و2000 حرف ]
    RateLimitError:
      description: تجاوز معدل الطلبات — مع رؤوس X-RateLimit-* وRetry-After / Rate limit exceeded
      headers:
        X-RateLimit-Limit: { schema: { type: integer } }
        X-RateLimit-Remaining: { schema: { type: integer } }
        X-RateLimit-Reset: { schema: { type: integer } }
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RateLimitError" }
    InterestConflict:
      description: تعارض في حالة الطلب / Interest state conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
          examples:
            not_pending: { summary: ليس معلقاً, value: { code: INTEREST_NOT_PENDING, message: لا يمكن معالجة طلب غير معلق } }
            cancelled: { summary: ملغي, value: { code: INTEREST_CANCELLED, message: عذراً، تم إلغاء هذا الطلب من قبل المستثمر } }
    InternalError:
      description: خطأ خادم / Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
          example: { code: INTERNAL_ERROR, message: حدث خطأ غير متوقع. يرجى المحاولة لاحقاً }

  schemas:
    # ---------------- Enums ----------------
    UserRole:
      type: string
      enum: [idea_owner, investor, admin]
      description: دور المستخدم — admin عبر seeder فقط / Role — admin via seeder only
    ProjectStatus:
      type: string
      enum: [draft, published, archived]
      description: حالة النشر / Publication state (enums.md §1.2)
    ProjectState:
      type: string
      enum: [completed, needs_development, needs_funding]
      description: حالة المشروع التجارية / Lifecycle state (enums.md §1.3)
    VisibilityLevel:
      type: integer
      enum: [1, 2, 3]
      description: "مستوى الإفصاح — 1: زائر (الدرجة فقط) · 2: مسجل (أبعاد+رادار) · 3: مالك/بعد الاتفاق (كل شيء) / Disclosure level"
    InterestStatus:
      type: string
      enum: [pending, accepted, rejected, cancelled]
      description: حالة طلب الاهتمام / Interest status
    InterestType:
      type: string
      enum: [investment, technical_development, consultation]
      description: نوع الاهتمام / Interest type
    EvaluationStatus:
      type: string
      enum: [processing, completed, failed, partial]
      description: حالة تقييم AI / Evaluation status
    FileType:
      type: string
      enum: [image, pdf, document]
      description: نوع ملف المشروع / Project file type
    VideoProvider:
      type: string
      enum: [youtube, vimeo]
      description: مزود الفيديو / Video provider
    AnalysisType:
      type: string
      enum: [competitive, swot, market, comparison]
      description: نوع تحليل وكيل AI / AI agent analysis type
    ModelUsed:
      type: string
      enum: [openai, claude]
      description: المزود الذي أجرى التقييم فعلياً / Provider that ran the evaluation

    # ---------------- Common ----------------
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: رمز الخطأ الآلي / Machine-readable code }
        message: { type: string, description: رسالة مترجمة / Localized message }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: تفاصيل تحقق لكل حقل / Per-field validation details
    ValidationError:
      allOf:
        - { $ref: "#/components/schemas/ApiError" }
      required: [code, errors]
      properties:
        code: { type: string, const: VALIDATION_ERROR }
    RateLimitError:
      type: object
      required: [code, message, retry_after, reset_at]
      properties:
        code: { type: string, const: RATE_LIMIT_EXCEEDED }
        message: { type: string }
        retry_after: { type: integer, description: ثوانٍ حتى المحاولة التالية / Seconds until retry }
        reset_at: { type: integer, description: Unix timestamp لإعادة التعيين / Reset timestamp }
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    PaginationMeta:
      type: object
      required: [current_page, per_page, total, last_page]
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
        from: { type: [integer, "null"] }
        to: { type: [integer, "null"] }
    HealthStatus:
      type: object
      required: [status, services, timestamp]
      properties:
        status: { type: string, enum: [ok, degraded] }
        services:
          type: object
          additionalProperties: { type: string, enum: [up, down] }
        timestamp: { type: string, format: date-time }
    Readiness:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ready, maintenance] }

    # ---------------- Auth ----------------
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 120, description: الاسم الكامل / Full name }
        email: { type: string, format: email, description: بريد فريد / Unique email }
        password: { type: string, format: password, minLength: 8, description: ≥ 8 أحرف مع حرف كبير ورقم / Min 8 chars with uppercase + digit }
        password_confirmation: { type: string }
        role: { type: string, enum: [idea_owner, investor], description: الدور — admin غير متاح / Role — admin not available }
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        avatar_url: { type: [string, "null"], format: uri }
        email_verified_at: { type: [string, "null"], format: date-time }
        provider: { type: [string, "null"], enum: [google, github, linkedin] }
        created_at: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [message, token, user]
      properties:
        message: { type: string }
        token: { type: string, description: توكن Sanctum — 24 ساعة / Sanctum token — 24h }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: بالثواني / Seconds }
        user: { $ref: "#/components/schemas/User" }
    RegisterResponse:
      type: object
      required: [message, user]
      properties:
        message: { type: string }
        user: { $ref: "#/components/schemas/User" }
    OAuthResponse:
      type: object
      required: [message, token, requires_role, user]
      properties:
        message: { type: string }
        token: { type: string }
        requires_role: { type: boolean, description: true عند أول دخول — يجب اختيار الدور / true on first login — role selection required }
        user: { $ref: "#/components/schemas/User" }
    ResetPasswordRequest:
      type: object
      required: [email, token, password, password_confirmation]
      properties:
        email: { type: string, format: email }
        token: { type: string, description: رمز إعادة التعيين من البريد — صالح ساعة / Reset token from email — 1h validity }
        password: { type: string, format: password, minLength: 8 }
        password_confirmation: { type: string }

    # ---------------- Profile ----------------
    IdeaOwnerProfile:
      type: object
      properties:
        bio: { type: [string, "null"], maxLength: 2000 }
        avatar_url: { type: [string, "null"], format: uri }
        skills: { type: array, items: { type: string }, description: مهارات صاحب الفكرة / Owner skills }
        social_links: { type: object, additionalProperties: { type: string, format: uri } }
        university: { type: [string, "null"], description: الجامعة / University }
        major: { type: [string, "null"], description: التخصص / Major }
    InvestorProfile:
      type: object
      properties:
        bio: { type: [string, "null"], maxLength: 2000 }
        avatar_url: { type: [string, "null"], format: uri }
        investment_focus: { type: [string, "null"], description: المجال الاستثماري — إلزامي لإرسال طلبات الاهتمام / Investment focus — required to send interests }
        investment_range:
          type: object
          properties:
            min: { type: number, description: حد أدنى بالريال/درهم/جنيه / Min amount }
            max: { type: number, description: حد أقصى / Max amount }
        preferred_sectors: { type: array, items: { type: string }, description: القطاعات المفضلة / Preferred sectors }
    ProfileResponse:
      type: object
      required: [user, profile]
      properties:
        user: { $ref: "#/components/schemas/User" }
        profile:
          oneOf:
            - { $ref: "#/components/schemas/IdeaOwnerProfile" }
            - { $ref: "#/components/schemas/InvestorProfile" }
          description: حقول الملف حسب الدور / Role-based profile fields
    ProfileUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        role: { type: string, enum: [idea_owner, investor], description: مقبول فقط عندما role=null (أول دخول OAuth) / Only when role is null (first OAuth login) }
        bio: { type: string, maxLength: 2000 }
        skills: { type: array, items: { type: string }, maxItems: 20 }
        social_links: { type: object, additionalProperties: { type: string, format: uri } }
        university: { type: string, maxLength: 120 }
        major: { type: string, maxLength: 120 }
        investment_focus: { type: string, maxLength: 120 }
        investment_range:
          type: object
          properties:
            min: { type: number, minimum: 0 }
            max: { type: number, minimum: 0 }
          description: يجب أن يكون min ≤ max / min must be ≤ max
        preferred_sectors: { type: array, items: { type: string }, maxItems: 20 }
    PublicProfileResponse:
      type: object
      required: [user, public_profile]
      properties:
        user:
          type: object
          required: [id, name, role]
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            role: { $ref: "#/components/schemas/UserRole" }
            avatar_url: { type: [string, "null"], format: uri }
            bio: { type: [string, "null"] }
            created_at: { type: string, format: date-time }
        public_profile:
          type: object
          description: حقول عامة بدون البريد الإلكتروني / Public fields — no email
          additionalProperties: true

    # ---------------- Projects ----------------
    ProjectWriteRequest:
      type: object
      # ملاحظة: POST يتطلب title/description/category/project_state — PUT يقبل تحديثاً جزئياً
      # Note: POST requires title/description/category/project_state — PUT accepts partial updates
      properties:
        title: { type: string, minLength: 5, maxLength: 120, description: عنوان المشروع / Title }
        description: { type: string, minLength: 50, maxLength: 2000, description: وصف المشروع / Description }
        category: { type: string, description: مجال المشروع / Category }
        project_state: { $ref: "#/components/schemas/ProjectState" }
        status: { $ref: "#/components/schemas/ProjectStatus", description: افتراضي published / Defaults to published }
        tags: { type: array, maxItems: 10, items: { type: string, maxLength: 30 }, description: حتى 10 علامات / Up to 10 tags }
        github_url: { type: [string, "null"], format: uri }
        video_url: { type: [string, "null"], format: uri, description: YouTube/Vimeo فقط / YouTube or Vimeo only }
        video_provider: { $ref: "#/components/schemas/VideoProvider" }
        budget_min: { type: number, minimum: 0, description: الحد الأدنى للميزانية / Min budget }
        budget_max: { type: number, minimum: 0, description: الحد الأقصى — يجب ≥ budget_min / Max budget ≥ min }
        business_info: { type: string, maxLength: 1000, description: نموذج العمل والسوق والمنافسون (مدخلات التقييم) / Business info (evaluation input) }
    ProjectCard:
      type: object
      required: [id, title, category, project_state, created_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description_excerpt: { type: string, description: مختصر حتى 100 حرف / Excerpt up to 100 chars }
        category: { type: string }
        project_state: { $ref: "#/components/schemas/ProjectState" }
        ai_score: { type: [number, "null"], minimum: 0, maximum: 100, description: التقييم الكلي (يُخفى للزائر حسب الإفصاح — يظهر دائماً في البطاقات) / Overall score }
        cover_image_url: { type: [string, "null"], format: uri }
        views_count: { type: integer }
        created_at: { type: string, format: date-time }
    ProjectCardList:
      type: object
      required: [data, meta, links]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ProjectCard" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
        links:
          type: object
          properties:
            first: { type: [string, "null"] }
            last: { type: [string, "null"] }
            prev: { type: [string, "null"] }
            next: { type: [string, "null"] }
    ProjectFile:
      type: object
      required: [id, type, file_url, mime_type, file_size]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/FileType" }
        original_name: { type: string }
        file_url: { type: string, format: uri }
        mime_type: { type: string }
        file_size: { type: integer, description: بالبايت / Bytes }
    ProjectEvaluationSummary:
      type: object
      required: [overall_score, last_evaluation_at]
      properties:
        overall_score: { type: [number, "null"], minimum: 0, maximum: 100 }
        last_evaluation_at: { type: [string, "null"], format: date-time }
    ProjectDetail:
      type: object
      required: [id, title, description, category, project_state, owner]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        project_state: { $ref: "#/components/schemas/ProjectState" }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        tags: { type: array, items: { type: string } }
        github_url: { type: [string, "null"], format: uri }
        video_url: { type: [string, "null"], format: uri }
        video_provider: { $ref: "#/components/schemas/VideoProvider" }
        budget_min: { type: [number, "null"] }
        budget_max: { type: [number, "null"] }
        views_count: { type: integer }
        owner:
          type: object
          required: [id, name]
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            avatar_url: { type: [string, "null"], format: uri }
        files: { type: array, items: { $ref: "#/components/schemas/ProjectFile" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectDetailResponse:
      type: object
      required: [visibility_level, project]
      properties:
        visibility_level: { $ref: "#/components/schemas/VisibilityLevel" }
        project: { $ref: "#/components/schemas/ProjectDetail" }
        evaluation:
          oneOf:
            - { $ref: "#/components/schemas/ProjectEvaluationSummary" }
            - { $ref: "#/components/schemas/Evaluation" }
          description: يعتمد على مستوى الإفصاح / Depends on disclosure level
    ProjectCreateResponse:
      type: object
      required: [message, project, evaluation]
      properties:
        message: { type: string }
        project: { $ref: "#/components/schemas/ProjectCard" }
        evaluation:
          type: object
          required: [status, eta_seconds]
          properties:
            status: { type: string, const: processing }
            eta_seconds: { type: integer, description: زمن المعالجة المستهدف 120 ثانية (P95) / Target processing time }
    ProjectUpdateResponse:
      type: object
      required: [message, project, significant_changed, re_evaluation_suggested]
      properties:
        message: { type: string }
        project: { $ref: "#/components/schemas/ProjectCard" }
        significant_changed: { type: boolean, description: تغيّر حقل جوهري / A significant field changed }
        re_evaluation_suggested: { type: boolean, description: اقتراح إعادة تقييم — دون بدء تلقائي (SRS-F04-02) / Suggest re-evaluation — never automatic }
    DeleteProjectResponse:
      type: object
      required: [message, trashed_until]
      properties:
        message: { type: string }
        trashed_until: { type: string, format: date-time, description: الحذف النهائي بعد 30 يوماً / Permanent deletion after 30 days }

    # ---------------- Files ----------------
    FileUploadResponse:
      type: object
      required: [message, uploaded, rejected]
      properties:
        message: { type: string }
        uploaded: { type: array, items: { $ref: "#/components/schemas/ProjectFile" } }
        rejected:
          type: array
          items:
            type: object
            required: [original_name, reason]
            properties:
              original_name: { type: string }
              reason: { type: string, description: رمز سبب الرفض (FILE_TYPE_NOT_ALLOWED/FILE_TOO_LARGE) / Rejection reason code }

    # ---------------- Evaluation ----------------
    DimensionSubScores:
      type: object
      description: الدرجات الفرعية تختلف حسب البعد (SRS-5.4.6.4) / Sub-scores vary per dimension
      additionalProperties: { type: number, minimum: 0, maximum: 100 }
    DimensionScore:
      type: object
      required: [score]
      properties:
        score: { type: number, minimum: 0, maximum: 100 }
        sub_scores: { $ref: "#/components/schemas/DimensionSubScores" }
        strengths: { type: array, items: { type: string } }
        weaknesses: { type: array, items: { type: string } }
    Evaluation:
      type: object
      required: [id, project_id, version, status, overall_score, created_at]
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        version: { type: integer, description: إصدار متزايد ذاتياً للمقارنة / Self-incrementing version }
        status: { $ref: "#/components/schemas/EvaluationStatus" }
        overall_score: { type: [number, "null"], minimum: 0, maximum: 100 }
        dimensions:
          type: object
          description: الأبعاد الخمسة — technical_quality, innovation, market_viability, team_completeness, documentation
          additionalProperties: { $ref: "#/components/schemas/DimensionScore" }
        dimensions_scores:
          type: object
          description: درجات الأبعاد للمستوى 2 (بدون تفاصيل) / Dimension scores for level 2
          additionalProperties: { type: number, minimum: 0, maximum: 100 }
        radar_data:
          type: object
          properties:
            labels: { type: array, items: { type: string } }
            values: { type: array, items: { type: number } }
        gap_analysis:
          type: object
          properties:
            technical_gaps: { type: array, items: { type: string } }
            market_gaps: { type: array, items: { type: string } }
            team_gaps: { type: array, items: { type: string } }
            documentation_gaps: { type: array, items: { type: string } }
        recommendations:
          type: object
          properties:
            immediate: { type: array, items: { type: string } }
            short_term: { type: array, items: { type: string } }
            long_term: { type: array, items: { type: string } }
        required_skills: { type: array, items: { type: string } }
        confidence_score: { type: [number, "null"], minimum: 0, maximum: 1 }
        warnings: { type: array, items: { type: string } }
        model_used: { $ref: "#/components/schemas/ModelUsed" }
        processing_time_ms: { type: [integer, "null"] }
        created_at: { type: string, format: date-time }
    EvaluationList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Evaluation" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    EvaluationStartedResponse:
      type: object
      required: [message, evaluation, eta_seconds]
      properties:
        message: { type: string }
        evaluation:
          type: object
          required: [id, status]
          properties:
            id: { type: integer, format: int64 }
            status: { type: string, const: processing }
            version: { type: integer, description: يُرجع في إعادة التقييم فقط / Returned on re-evaluation }
        eta_seconds: { type: integer }
    EvaluationCachedResponse:
      type: object
      required: [message, evaluation, cached, next_evaluation_at]
      properties:
        message: { type: string }
        evaluation:
          type: object
          required: [id, status]
          properties:
            id: { type: integer, format: int64 }
            status: { type: string, const: completed }
            overall_score: { type: number }
        cached: { type: boolean, const: true }
        next_evaluation_at: { type: string, format: date-time }
    EvaluationRateLimitedResponse:
      type: object
      required: [code, message, last_evaluation_at, next_evaluation_at]
      properties:
        code: { type: string, const: EVALUATION_RATE_LIMITED }
        message: { type: string }
        last_evaluation_at: { type: string, format: date-time }
        next_evaluation_at: { type: string, format: date-time }
    EvaluationStatusResponse:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/EvaluationStatus" }
        evaluation_id: { type: [integer, "null"], format: int64 }
        overall_score: { type: [number, "null"] }
        message: { type: [string, "null"], description: رسالة الحالة (processing/failed) / Status message }
        started_at: { type: [string, "null"], format: date-time }
        eta_seconds: { type: [integer, "null"] }
        last_evaluation_at: { type: [string, "null"], format: date-time }
        next_evaluation_at: { type: [string, "null"], format: date-time }

    # ---------------- Search ----------------
    SearchFacets:
      type: object
      properties:
        categories: { type: object, additionalProperties: { type: integer } }
        project_states: { type: object, additionalProperties: { type: integer } }
        score_ranges: { type: object, additionalProperties: { type: integer } }
    SearchResponse:
      type: object
      required: [data, meta, facets, query]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ProjectCard" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
        facets: { $ref: "#/components/schemas/SearchFacets" }
        query: { type: object, description: معايير البحث الحالية للمشاركة عبر الرابط / Active criteria for permalinks }
    Suggestion:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [project, tag] }
        id: { type: [integer, "null"] }
        title: { type: [string, "null"] }
        value: { type: [string, "null"], description: قيمة العلامة / Tag value }

    # ---------------- Interest & Agreement ----------------
    InterestRequest:
      type: object
      required: [interest_type]
      properties:
        interest_type: { $ref: "#/components/schemas/InterestType" }
        message: { type: string, maxLength: 500, description: رسالة اختيارية / Optional message }
    Interest:
      type: object
      required: [id, project_id, interest_type, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        project_title: { type: string }
        interest_type: { $ref: "#/components/schemas/InterestType" }
        message: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/InterestStatus" }
        rejection_reason: { type: [string, "null"] }
        agreement_id: { type: [integer, "null"], format: int64 }
        created_at: { type: string, format: date-time }
    InterestResponse:
      type: object
      required: [message, interest]
      properties:
        message: { type: string }
        interest: { $ref: "#/components/schemas/Interest" }
    InterestReceived:
      allOf:
        - { $ref: "#/components/schemas/Interest" }
        - type: object
          properties:
            investor:
              type: object
              required: [id, name]
              properties:
                id: { type: integer, format: int64 }
                name: { type: string }
                avatar_url: { type: [string, "null"], format: uri }
    InterestReceivedList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/InterestReceived" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    InterestSent:
      allOf:
        - { $ref: "#/components/schemas/Interest" }
        - type: object
          properties:
            project_ai_score: { type: [number, "null"] }
    InterestSentList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/InterestSent" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    AcceptInterestResponse:
      type: object
      required: [message, interest, agreement]
      properties:
        message: { type: string }
        interest:
          type: object
          required: [id, status, accepted_at]
          properties:
            id: { type: integer, format: int64 }
            status: { type: string, const: accepted }
            accepted_at: { type: string, format: date-time }
        agreement:
          type: object
          required: [id, pdf_url]
          properties:
            id: { type: integer, format: int64 }
            pdf_url: { type: string, description: رابط تحميل المستند / Document download link }
            idea_owner: { type: object, required: [name, email], properties: { name: { type: string }, email: { type: string, format: email } } }
            investor: { type: object, required: [name, email], properties: { name: { type: string }, email: { type: string, format: email } } }
    RejectInterestResponse:
      type: object
      required: [message, interest]
      properties:
        message: { type: string }
        interest:
          type: object
          required: [id, status, rejected_at]
          properties:
            id: { type: integer, format: int64 }
            status: { type: string, const: rejected }
            rejected_at: { type: string, format: date-time }

    # ---------------- Notifications ----------------
    Notification:
      type: object
      required: [id, type, title, body, is_critical, read_at, created_at]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, description: interest.created · evaluation.completed · interest.accepted · interest.rejected · evaluation.retry · project.updated · analysis.completed }
        title: { type: string }
        body: { type: string }
        data: { type: [object, "null"], description: "بيانات سياقية (interest_id, project_id...) / Contextual data" }
        is_critical: { type: boolean, description: يُرسل عبر WebSocket / Pushed via WebSocket }
        read_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [data, meta, unread_count]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
        unread_count: { type: integer }
    NotificationReadResponse:
      type: object
      required: [message, notification]
      properties:
        message: { type: string }
        notification:
          type: object
          required: [id, read_at]
          properties:
            id: { type: integer, format: int64 }
            read_at: { type: string, format: date-time }

    # ---------------- Dashboard ----------------
    SavedProject:
      type: object
      required: [project, saved_at]
      properties:
        project: { $ref: "#/components/schemas/ProjectCard" }
        saved_at: { type: string, format: date-time }
    SavedProjectsList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/SavedProject" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    SaveProjectResponse:
      type: object
      required: [message, saved]
      properties:
        message: { type: string }
        saved: { type: boolean }
        already_saved: { type: boolean, description: كان محفوظاً مسبقاً / Was already saved }
    TrashedProject:
      type: object
      required: [id, title, category, project_state, deleted_at, auto_delete_at, days_remaining]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        category: { type: string }
        project_state: { $ref: "#/components/schemas/ProjectState" }
        ai_score: { type: [number, "null"] }
        deleted_at: { type: string, format: date-time }
        auto_delete_at: { type: string, format: date-time, description: بعد 30 يوماً من الحذف / 30 days after deletion }
        days_remaining: { type: integer, description: الأيام المتبقية للاسترجاع / Days left to restore }
    TrashedProjectsList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/TrashedProject" } }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    RestoreProjectResponse:
      type: object
      required: [message, project]
      properties:
        message: { type: string }
        project: { $ref: "#/components/schemas/ProjectCard" }
    DashboardActivity:
      type: object
      required: [type, title, created_at]
      properties:
        type: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
    IdeaOwnerStats:
      type: object
      required: [total_projects, average_score, total_interests, accepted_interests, pending_interests, trash_count]
      properties:
        total_projects: { type: integer }
        average_score: { type: [number, "null"] }
        total_interests: { type: integer }
        accepted_interests: { type: integer }
        pending_interests: { type: integer }
        trash_count: { type: integer }
    IdeaOwnerDashboard:
      type: object
      required: [stats, projects, activities, quick_actions]
      properties:
        stats: { $ref: "#/components/schemas/IdeaOwnerStats" }
        projects: { type: array, items: { $ref: "#/components/schemas/ProjectCard" } }
        activities:
          type: object
          required: [data, meta]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/DashboardActivity" } }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
        quick_actions:
          type: array
          items: { type: string, enum: [add_project, view_projects, manage_interests] }
    InvestorStats:
      type: object
      required: [sent_interests, accepted_interests, pending_interests, rejected_interests, saved_projects]
      properties:
        sent_interests: { type: integer }
        accepted_interests: { type: integer }
        pending_interests: { type: integer }
        rejected_interests: { type: integer }
        saved_projects: { type: integer }
    InvestorDashboard:
      type: object
      required: [stats, recommendations, sent_interests, saved_projects, feed]
      properties:
        stats: { $ref: "#/components/schemas/InvestorStats" }
        recommendations:
          type: array
          maxItems: 10
          description: حسب المجال الاستثماري المسجل / Based on registered investment focus
          items: { $ref: "#/components/schemas/ProjectCard" }
        sent_interests: { type: array, items: { $ref: "#/components/schemas/InterestSent" } }
        saved_projects: { type: array, items: { $ref: "#/components/schemas/SavedProject" } }
        feed: { type: array, items: { $ref: "#/components/schemas/DashboardActivity" } }

    # ---------------- Admin ----------------
    AdminAnalytics:
      type: object
      required: [users, projects, evaluations, interests, generated_at]
      properties:
        users:
          type: object
          required: [total, by_role, active_last_7_days]
          properties:
            total: { type: integer }
            by_role:
              type: object
              required: [idea_owner, investor, admin]
              properties:
                idea_owner: { type: integer }
                investor: { type: integer }
                admin: { type: integer }
            active_last_7_days:
              type: array
              items:
                type: object
                required: [date, count]
                properties:
                  date: { type: string, format: date }
                  count: { type: integer }
        projects:
          type: object
          required: [total, by_status, by_category]
          properties:
            total: { type: integer }
            by_status: { type: object, additionalProperties: { type: integer } }
            by_category: { type: object, additionalProperties: { type: integer } }
        evaluations:
          type: object
          required: [total, average_score, success_rate]
          properties:
            total: { type: integer }
            average_score: { type: number }
            success_rate: { type: number, minimum: 0, maximum: 1 }
        interests:
          type: object
          required: [total, by_status]
          properties:
            total: { type: integer }
            by_status: { type: object, additionalProperties: { type: integer } }
        generated_at: { type: string, format: date-time }

    # ---------------- AI Agent ----------------
    AnalysisStartedResponse:
      type: object
      required: [message, artifact]
      properties:
        message: { type: string }
        artifact:
          type: object
          required: [id, project_id, analysis_type, status]
          properties:
            id: { type: integer, format: int64 }
            project_id: { type: integer, format: int64 }
            analysis_type: { $ref: "#/components/schemas/AnalysisType" }
            status: { type: string, const: processing }
    AnalysisResponse:
      type: object
      required: [artifact]
      properties:
        artifact:
          type: object
          required: [id, project_id, analysis_type, version, status, artifact_data, created_at]
          properties:
            id: { type: integer, format: int64 }
            project_id: { type: integer, format: int64 }
            analysis_type: { $ref: "#/components/schemas/AnalysisType" }
            version: { type: integer }
            status: { type: string, enum: [processing, completed] }
            artifact_data:
              type: object
              description: "مخرجات نصية وقوالب فقط — بنية حسب النوع (SWOT: strengths/weaknesses/opportunities/threats/recommendations) / Text & template outputs only"
              additionalProperties: true
            created_at: { type: string, format: date-time }
