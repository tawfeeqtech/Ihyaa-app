              schema: { $ref: "#/components/schemas/InvestorDashboard" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimitError"

  # ============================================================
  # ADMIN — SRS-API-40..41
  # ============================================================
  /admin/analytics:
    get:
      tags: [Admin]
      summary: لوحة تحليلات المشرف / Admin analytics (SRS-API-40)
      description: |
        إحصائيات المستخدمين (حسب الدور)، المشاريع (حسب الحالة والمجال)، متوسط التقييم،
