        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /projects/{project}/save:
    post:
      tags: [Dashboard]
      summary: حفظ مشروع / Save project (SRS-API-33)
      description: |
        حفظ مشروع في قائمة المستثمر — Idempotent (يعيد already_saved عند التكرار).
        Rate Limit: investor.write — 10/دقيقة.
      operationId: saveProject
      x-srs-api: SRS-API-33
      x-rate-limit: "10/دقيقة · user_id · L4-W"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectPath"
      responses:
        "200":
          description: حُفظ / Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveProjectResponse" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ProjectUnavailable"
        "429":
          $ref: "#/components/responses/RateLimitError"
    delete:
      tags: [Dashboard]
      summary: إزالة من المحفوظات / Unsave project (SRS-API-34)
      description: "Rate Limit: investor.write — 10/دقيقة."
      operationId: unsaveProject
      x-srs-api: SRS-API-34
      x-rate-limit: "10/دقيقة · user_id · L4-W"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectPath"
      responses:
        "200":
          description: أُزيل / Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveProjectResponse" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /trashed-projects:
    get:
      tags: [Dashboard]
      summary: سلة المهملات / Trashed projects (SRS-API-35)
      description: |
        مشاريع صاحب الفكرة المحذوفة مع عدّاد الأيام المتبقية للحذف النهائي (30 يوماً).
        Rate Limit: shared.read — 20/دقيقة.
      operationId: trashedProjects
      x-srs-api: SRS-API-35
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: القائمة / List
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashedProjectsList" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /trashed-projects/{project}/restore:
    post:
      tags: [Dashboard]
      summary: استرجاع مشروع / Restore project (SRS-API-36)
      description: |
        استرجاع مشروع محذوف خلال 30 يوماً — للمالك. Rate Limit: shared.write — 10/دقيقة.
      operationId: restoreProject
      x-srs-api: SRS-API-36
      x-rate-limit: "10/دقيقة · user_id · L3-W"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectPath"
      responses:
        "200":
          description: استُرجع / Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreProjectResponse" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: غير موجود أو انتهت المهلة / Not found or past 30 days
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example: { code: NOT_FOUND, message: انتهت مهلة الاسترجاع (30 يوماً) }
        "429":
          $ref: "#/components/responses/RateLimitError"

  /trashed-projects/{project}/force:
    delete:
      tags: [Dashboard]
      summary: حذف نهائي / Force delete (SRS-API-37)
      description: |
        حذف نهائي قبل انتهاء الـ 30 يوماً — للمالك. لا يمكن التراجع.
        Rate Limit: shared.write — 10/دقيقة.
      operationId: forceDeleteProject
      x-srs-api: SRS-API-37
      x-rate-limit: "10/دقيقة · user_id · L3-W"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectPath"
      responses:
        "200":
          description: حُذف نهائياً / Permanently deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
              example: { message: تم حذف المشروع نهائياً (لا يمكن التراجع) }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /dashboard/idea-owner:
    get:
